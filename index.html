<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - Elegant Version</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>📋 My Todo List</h1>
      <p>Kelola aktivitasmu dengan mudah dan rapi</p>
    </header>

    <main>
      <section class="todo-container">
        <form id="todo-form">
          <input
            type="text"
            id="todo-input"
            placeholder="Tulis kegiatan baru..."
            required
          />
          <button type="submit">Tambah</button>
        </form>

        <div class="controls">
          <select id="filter">
            <option value="all">Semua</option>
            <option value="completed">Selesai</option>
            <option value="pending">Belum Selesai</option>
          </select>
          <input type="text" id="search" placeholder="Cari todo..." />
        </div>

        <ul id="todo-list"></ul>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <p>&copy; 2025 Todo App | Dibuat oleh Marshall M</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer"
            >GitHub</a
          >
        </div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
