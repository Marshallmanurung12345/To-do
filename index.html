<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Todo List</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>

    <div class="input-section">
      <input type="text" id="todo-input" placeholder="Tulis todo baru lalu tekan Enter..." />
      <button id="add-btn">Tambah</button>
    </div>

    <div class="filter-search">
      <select id="filter">
        <option value="all">Semua</option>
        <option value="completed">Selesai</option>
        <option value="uncompleted">Belum Selesai</option>
      </select>
      <input type="text" id="search" placeholder="Cari todo..." />
    </div>

    <ul id="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
