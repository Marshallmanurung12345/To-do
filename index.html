<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - Praktikum 3</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="vendor/bootstrap-5.3.7/package/dist/css/bootstrap.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" type="image/png" href="assets/logo.jpg" />
  </head>
  <body>
    <header>
      <h1>📋 My Todo List</h1>
      <p>Sederhanakan hidup, atur prioritasmu dengan lebih rapi.</p>
    </header>

    <main>
      <section class="todo-container">
        <form id="todo-form">
          <input
            type="text"
            id="todo-input"
            placeholder="Tulis kegiatan baru..."
            required
          />
          <button type="submit">Tambah</button>
        </form>

        <div class="controls">
          <select id="filter">
            <option value="all">Semua</option>
            <option value="completed">Selesai</option>
            <option value="pending">Belum Selesai</option>
          </select>
          <input type="text" id="search" placeholder="Cari todo..." />
        </div>

        <ul id="todo-list"></ul>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <p>&copy; 2025 Todo App | Dibuat oleh Marshall M</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer"
            >GitHub</a
          >
        </div>
      </div>
    </footer>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <!-- Toast akan muncul di sini -->
    </div>

    <script src="app.js"></script>
    <script src="vendor/bootstrap-5.3.7/package/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
